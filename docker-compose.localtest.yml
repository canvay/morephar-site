# 本地测试专用编排（不参与生产）
# 等价于 docker-compose.prod.yml 的容器拓扑，但：
#   - 用 build: 直接在本地构建镜像，不依赖镜像仓库（无需 REGISTRY/REGISTRY_NAMESPACE）
#   - Nginx 只暴露 8080，避免占用本机 80/443
# 运行: docker compose -f docker-compose.localtest.yml up -d --build
# 停止: docker compose -f docker-compose.localtest.yml down
#
# 环境变量用 :- 默认值兜底，本地无需创建 .env 也能跑（值仅用于本地测试）。

services:
  strapi:
    build: ./backend
    image: morephar-strapi:localtest
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      NODE_ENV: production
      APP_KEYS: ${APP_KEYS:-localtest1,localtest2}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-localtestsalt}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-localtestadminjwt}
      JWT_SECRET: ${JWT_SECRET:-localtestjwt}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-localtesttransfer}
      STRAPI_URL: ${STRAPI_URL:-http://localhost:8080}
    volumes:
      - strapi_data:/app/.tmp
      - strapi_uploads:/app/public/uploads
    expose:
      - "1337"

  next:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_STRAPI_API_URL: "http://localhost:8080"
        NEXT_PUBLIC_STRAPI_API_TOKEN: "localtest"
        NEXT_PUBLIC_STRAPI_FORM_SUBMISSION_TOKEN: "localtest"
        NEXT_PUBLIC_PAGE_LIMIT: "6"
    image: morephar-next:localtest
    restart: unless-stopped
    environment:
      # 服务端 fetch 直连 Strapi 容器（localhost:8080 只对浏览器有效）
      STRAPI_API_URL: http://strapi:1337
    depends_on:
      - strapi
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - strapi
      - next
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/www:/var/www/certbot:ro

volumes:
  strapi_data:
  strapi_uploads:
