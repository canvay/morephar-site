<svg xmlns="http://www.w3.org/2000/svg" width="560" height="120" viewBox="0 0 560 120" role="img" aria-label="Morephare">
  <!-- Mark: lamp bar + lens pixel + beam + light dot -->
  <g transform="translate(12,10)">
    <line x1="58" y1="32" x2="88" y2="6" stroke="#1E3A8A" stroke-width="12"/>
    <rect x="8" y="38" width="40" height="12" rx="2" fill="#1E3A8A"/>
    <rect x="52" y="38" width="12" height="12" fill="#38BDF8"/>
    <rect x="68" y="41" width="6" height="6" fill="#1E3A8A"/>
    <circle cx="30" cy="76" r="16" fill="#1E3A8A"/>
  </g>
  <!-- Wordmark: M in deep indigo, orephare in brand blue -->
  <text x="132" y="84" font-family="Montserrat,'Poppins','Segoe UI',Arial,sans-serif" font-size="72" font-weight="700" letter-spacing="-1">
    <tspan fill="#1E3A8A">M</tspan><tspan fill="#2563EB">orephare</tspan>
  </text>
</svg>
