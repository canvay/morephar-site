# GitHub Actions - 仅构建(含 NEXT_PUBLIC_*)并部署前端 Next.js
# 运行环境: 腾讯云 CVM 上的 self-hosted runner（镜像本机构建并直接运行，无需推送镜像仓库）
#
# 前置: 后端已部署，且在 frontend/.env.prod 中填好 NEXT_PUBLIC_STRAPI_API_TOKEN / _FORM_SUBMISSION_TOKEN
#   (首次引导见 deploy-backend.yml: 先部署后端 -> 后台建 Token -> 填入 frontend/.env.prod -> 再跑本流程)
#
# 触发:
#   - 手动 (Actions 页面 Run workflow)
#   - 或 push 到 main 且改动 frontend/ 或 docker-compose.prod.yml 或 nginx/
#
# 所需配置（均来自 frontend/.env.prod，无需 GitHub Secrets）:
#   NEXT_PUBLIC_STRAPI_API_URL / _API_TOKEN / _FORM_SUBMISSION_TOKEN / _PAGE_LIMIT（构建期写死进镜像）
#   APP_KEYS / API_TOKEN_SALT / ADMIN_JWT_SECRET / JWT_SECRET / TRANSFER_TOKEN_SALT / STRAPI_URL（compose up -d strapi 用）
#   注意: 不再依赖 GitHub Secrets（NEXT_PUBLIC_* 与 Strapi 密钥都从 frontend/.env.prod 读取）。
#   安全提示: .env.prod 含密钥且已入库（按用户要求忽略安全限制）。

name: Deploy Frontend (Next.js)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'docker-compose.prod.yml'
      - 'nginx/**'

jobs:
  deploy:
    name: Build & run Next (self-hosted, 本地镜像)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # 复制 frontend/.env.prod（含 Strapi 运行时密钥 + NEXT_PUBLIC_*）为 .env 供 docker compose 读取
      - name: Load .env from frontend/.env.prod
        run: |
          SRC="frontend/.env.prod"
          if [ ! -f "$SRC" ]; then
            echo "错误: 未找到 $SRC" >&2
            echo "请确保 frontend/.env.prod 已提交到仓库，至少包含: APP_KEYS, API_TOKEN_SALT, ADMIN_JWT_SECRET, JWT_SECRET, TRANSFER_TOKEN_SALT, STRAPI_URL, NEXT_PUBLIC_*" >&2
            exit 1
          fi
          cp "$SRC" .env
          echo "已加载 .env ($(grep -c '=' .env) 个变量)"

      - name: Build Next image (本地)
        run: |
          set -a
          source frontend/.env.prod
          set +a
          docker build \
            --build-arg NPM_REGISTRY=https://registry.npmmirror.com \
            --build-arg NEXT_PUBLIC_STRAPI_API_URL="$NEXT_PUBLIC_STRAPI_API_URL" \
            --build-arg NEXT_PUBLIC_STRAPI_API_TOKEN="$NEXT_PUBLIC_STRAPI_API_TOKEN" \
            --build-arg NEXT_PUBLIC_STRAPI_FORM_SUBMISSION_TOKEN="$NEXT_PUBLIC_STRAPI_FORM_SUBMISSION_TOKEN" \
            --build-arg NEXT_PUBLIC_PAGE_LIMIT="$NEXT_PUBLIC_PAGE_LIMIT" \
            -t morephar-next:latest ./frontend

      - name: Run next + nginx
        run: |
          set -e
          # strapi 若已运行则无变化；nginx 反代 / 到 next
          docker compose -f docker-compose.prod.yml up -d strapi next nginx
          docker image prune -f
