# GitHub Actions - 仅构建(含 NEXT_PUBLIC_*)并部署前端 Next.js
#
# 前置: 后端已部署，且以下 Secrets 已就绪:
#   NEXT_PUBLIC_STRAPI_API_TOKEN / NEXT_PUBLIC_STRAPI_FORM_SUBMISSION_TOKEN
#   (首次引导见 deploy-backend.yml: 先部署后端 -> 后台建 Token -> 回填 Secrets -> 再跑本流程)
#
# 触发:
#   - 手动 (Actions 页面 Run workflow)
#   - 或 push 到 main 且改动 frontend/ 或 docker-compose.prod.yml 或 nginx/
#
# 所需 Secrets:
#   REGISTRY / REGISTRY_NAMESPACE / REGISTRY_USERNAME / REGISTRY_PASSWORD (镜像仓库)
#   SSH_HOST / SSH_USERNAME / SSH_PRIVATE_KEY / SSH_PORT(可选)                (服务器登录)
#   NEXT_PUBLIC_STRAPI_API_URL / _API_TOKEN / _FORM_SUBMISSION_TOKEN / _PAGE_LIMIT

name: Deploy Frontend (Next.js)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'docker-compose.prod.yml'
      - 'nginx/**'

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  REGISTRY_NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE }}
  IMAGE_PREFIX: ${{ secrets.REGISTRY }}/${{ secrets.REGISTRY_NAMESPACE }}
  DEPLOY_DIR: /var/www/morephar

jobs:
  build-and-push:
    name: Build & push Next image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Build & push Next image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_STRAPI_API_URL="${{ secrets.NEXT_PUBLIC_STRAPI_API_URL }}" \
            --build-arg NEXT_PUBLIC_STRAPI_API_TOKEN="${{ secrets.NEXT_PUBLIC_STRAPI_API_TOKEN }}" \
            --build-arg NEXT_PUBLIC_STRAPI_FORM_SUBMISSION_TOKEN="${{ secrets.NEXT_PUBLIC_STRAPI_FORM_SUBMISSION_TOKEN }}" \
            --build-arg NEXT_PUBLIC_PAGE_LIMIT="${{ secrets.NEXT_PUBLIC_PAGE_LIMIT || '6' }}" \
            -t "$IMAGE_PREFIX/morephar-next:latest" ./frontend
          docker push "$IMAGE_PREFIX/morephar-next:latest"

  deploy:
    name: Push config & run on CVM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure remote deploy dir exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            mkdir -p ${{ env.DEPLOY_DIR }}/nginx

      # 只拷运行配置，绝不拷整个 nginx/ 目录（会覆盖 certs/www 里的 Let's Encrypt 证书）
      - name: SCP docker-compose.prod.yml
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "docker-compose.prod.yml"
          target: "${{ env.DEPLOY_DIR }}"

      - name: SCP nginx.conf (into nginx/ subdir)
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "nginx/nginx.conf"
          target: "${{ env.DEPLOY_DIR }}/nginx"

      - name: Login, pull & run next + nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            cd ${{ env.DEPLOY_DIR }}
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ secrets.REGISTRY }}" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull next
            # 起全量三服务（strapi 已运行则无变化；nginx 反代 / 到 next）
            docker compose -f docker-compose.prod.yml up -d strapi next nginx
            docker image prune -f
