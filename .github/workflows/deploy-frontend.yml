# GitHub Actions - 仅构建(含 NEXT_PUBLIC_*)并部署前端 Next.js
# 运行环境: 腾讯云 CVM 上的 self-hosted runner（镜像本机构建并直接运行，无需推送镜像仓库）
#
# 前置: 后端已部署，且以下 Secrets 已就绪:
#   NEXT_PUBLIC_STRAPI_API_TOKEN / NEXT_PUBLIC_STRAPI_FORM_SUBMISSION_TOKEN
#   (首次引导见 deploy-backend.yml: 先部署后端 -> 后台建 Token -> 回填 Secrets -> 再跑本流程)
#
# 触发:
#   - 手动 (Actions 页面 Run workflow)
#   - 或 push 到 main 且改动 frontend/ 或 docker-compose.prod.yml 或 nginx/
#
# 所需配置:
#   前端构建期写死的 NEXT_PUBLIC_* 仍来自 GitHub Secrets:
#     NEXT_PUBLIC_STRAPI_API_URL / _API_TOKEN / _FORM_SUBMISSION_TOKEN / _PAGE_LIMIT
#   Strapi 运行时 6 项密钥来自 CVM 本地 /opt/morephar/.env.prod（不入库、不进 GitHub Secrets），
#     本流程复制它到工作区供 compose up -d strapi 使用。
#   注意: 不需要 TCR 相关 Secrets（镜像仅在 CVM 本机构建并直接运行，不推送镜像仓库）
#   SSH_* 系列 Secrets 已不再需要

name: Deploy Frontend (Next.js)

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'frontend/**'
  #     - 'docker-compose.prod.yml'
  #     - 'nginx/**'

jobs:
  deploy:
    name: Build & run Next (self-hosted, 本地镜像)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # 同后端：从 CVM 本地 /opt/morephar/.env.prod 复制 Strapi 运行时密钥到工作区 .env
      - name: Load .env from server local .env.prod
        run: |
          SRC="/opt/morephar/.env.prod"
          if [ ! -f "$SRC" ]; then
            echo "错误: 未找到 $SRC" >&2
            echo "请在 CVM 上创建该文件，至少包含: APP_KEYS, API_TOKEN_SALT, ADMIN_JWT_SECRET, JWT_SECRET, TRANSFER_TOKEN_SALT, STRAPI_URL" >&2
            exit 1
          fi
          cp "$SRC" .env
          echo "已加载 .env ($(grep -c '=' .env) 个变量)"

      - name: Build Next image (本地)
        run: |
          docker build \
            --build-arg NPM_REGISTRY=https://registry.npmmirror.com \
            --build-arg NEXT_PUBLIC_STRAPI_API_URL="${{ secrets.NEXT_PUBLIC_STRAPI_API_URL }}" \
            --build-arg NEXT_PUBLIC_STRAPI_API_TOKEN="${{ secrets.NEXT_PUBLIC_STRAPI_API_TOKEN }}" \
            --build-arg NEXT_PUBLIC_STRAPI_FORM_SUBMISSION_TOKEN="${{ secrets.NEXT_PUBLIC_STRAPI_FORM_SUBMISSION_TOKEN }}" \
            --build-arg NEXT_PUBLIC_PAGE_LIMIT="${{ secrets.NEXT_PUBLIC_PAGE_LIMIT || '6' }}" \
            -t morephar-next:latest ./frontend

      - name: Run next + nginx
        run: |
          set -e
          # strapi 若已运行则无变化；nginx 反代 / 到 next
          docker compose -f docker-compose.prod.yml up -d strapi next nginx
          docker image prune -f
