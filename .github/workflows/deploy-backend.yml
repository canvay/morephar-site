# GitHub Actions - 仅构建并部署后端 Strapi
# 运行环境: 腾讯云 CVM 上的 self-hosted runner（镜像本机构建并直接运行，无需推送镜像仓库，避开低带宽上传瓶颈）
#
# 用途:
#   1. 首次引导: 先跑本流程部署后端 -> 进 http://<IP>/admin 生成 API Token
#      -> 把 Token 回填到 GitHub Secrets -> 再跑 deploy-frontend.yml 构建前端
#   2. 后端代码/配置变更时单独部署，不触发前端重建
#
# 触发:
#   - 手动 (Actions 页面 Run workflow)
#   - 或 push 到 main 且改动 backend/ 或 docker-compose.prod.yml 或 nginx/
#
# 所需配置（无需 GitHub Secrets）:
#   仓库根目录已提交 .env.prod（含以下 6 项 Strapi 运行时密钥），本流程直接复制为 .env 供 docker compose 读取：
#     APP_KEYS / API_TOKEN_SALT / ADMIN_JWT_SECRET / JWT_SECRET / TRANSFER_TOKEN_SALT / STRAPI_URL
#   注意: 本流程不需要 NEXT_PUBLIC_* (那是前端构建用的，仍走 GitHub Secrets)，也不需要 TCR / SSH 相关 Secrets
#         （镜像仅在 CVM 本机构建并直接运行，不推送镜像仓库）
#   ⚠️ 安全提示: .env.prod 含密钥且已入库，请确保仓库为【私有】；公开仓请勿提交真实密钥。

name: Deploy Backend (Strapi)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.prod.yml'
      - 'nginx/**'

jobs:
  deploy:
    name: Build & run Strapi (self-hosted, 本地镜像)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # 使用仓库内已提交的 .env.prod（含 Strapi 运行时密钥），复制为 .env 供 docker compose 读取。
      # actions/checkout 已把 .env.prod 拉到工作区根目录，故直接 cp 即可。
      - name: Load .env from repo .env.prod
        run: |
          SRC=".env.prod"
          if [ ! -f "$SRC" ]; then
            echo "错误: 仓库根目录未找到 $SRC" >&2
            echo "请确保 .env.prod 已提交到仓库根目录，至少包含: APP_KEYS, API_TOKEN_SALT, ADMIN_JWT_SECRET, JWT_SECRET, TRANSFER_TOKEN_SALT, STRAPI_URL" >&2
            exit 1
          fi
          cp "$SRC" .env
          echo "已加载 .env ($(grep -c '=' .env) 个变量)"

      - name: Build Strapi image (本地)
        run: |
          docker build \
            --build-arg ALPINE_MIRROR=https://mirrors.tencent.com \
            --build-arg NPM_REGISTRY=https://registry.npmmirror.com \
            -t morephar-strapi:latest ./backend

      - name: Run strapi + nginx
        run: |
          set -e
          # 先起后端 + 反代，使 /admin 可访问（next 尚未构建，/ 会 502，属正常）
          docker compose -f docker-compose.prod.yml up -d strapi nginx
          docker image prune -f
