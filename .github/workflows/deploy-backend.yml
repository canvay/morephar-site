# GitHub Actions - 仅构建并部署后端 Strapi
#
# 用途:
#   1. 首次引导: 先跑本流程部署后端 -> 进 http://<IP>/admin 生成 API Token
#      -> 把 Token 回填到 GitHub Secrets -> 再跑 deploy-frontend.yml 构建前端
#   2. 后端代码/配置变更时单独部署，不触发前端重建
#
# 触发:
#   - 手动 (Actions 页面 Run workflow)
#   - 或 push 到 main 且改动 backend/ 或 docker-compose.prod.yml 或 nginx/
#
# 所需 Secrets:
#   REGISTRY / REGISTRY_NAMESPACE / REGISTRY_USERNAME / REGISTRY_PASSWORD (镜像仓库)
#   SSH_HOST / SSH_USERNAME / SSH_PRIVATE_KEY / SSH_PORT(可选)                (服务器登录)
#   注意: 本流程不需要 NEXT_PUBLIC_* (那是前端构建用的)

name: Deploy Backend (Strapi)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.prod.yml'
      - 'nginx/**'

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  REGISTRY_NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE }}
  IMAGE_PREFIX: ${{ secrets.REGISTRY }}/${{ secrets.REGISTRY_NAMESPACE }}
  DEPLOY_DIR: /var/www/morephar

jobs:
  build-and-push:
    name: Build & push Strapi image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Build & push Strapi image
        run: |
          docker build -t "$IMAGE_PREFIX/morephar-strapi:latest" ./backend
          docker push "$IMAGE_PREFIX/morephar-strapi:latest"

  deploy:
    name: Push config & run on CVM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # 仅为拿到 docker-compose.prod.yml / nginx/nginx.conf 用于 SCP（不会在服务器编译）
      - uses: actions/checkout@v4

      - name: Ensure remote deploy dir exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            mkdir -p ${{ env.DEPLOY_DIR }}/nginx

      # 只拷运行配置，绝不拷整个 nginx/ 目录（会覆盖 certs/www 里的 Let's Encrypt 证书）
      - name: SCP docker-compose.prod.yml
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "docker-compose.prod.yml"
          target: "${{ env.DEPLOY_DIR }}"

      - name: SCP nginx.conf (into nginx/ subdir)
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "nginx/nginx.conf"
          target: "${{ env.DEPLOY_DIR }}/nginx"

      - name: Login, pull & run strapi + nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            cd ${{ env.DEPLOY_DIR }}
            # 登录镜像仓库以拉取私有镜像（公开镜像可去掉下面这行）
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ secrets.REGISTRY }}" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull strapi
            # 先起后端 + 反代，使 /admin 可访问（next 尚未构建，/ 会 502，属正常）
            docker compose -f docker-compose.prod.yml up -d strapi nginx
            docker image prune -f
