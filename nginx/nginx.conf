# Morephar 站点 - Nginx 反代配置
# 前端 (Next.js) 走 /，后端 (Strapi) 走 /api /uploads /admin 等

# ============ HTTP (80) ============
# 未申请 HTTPS 证书前，先用这个 80 端口配置让站点跑起来。
# 申请到证书后，建议把下面 location / 与 API 段复制进 443 块并启用下方 HTTPS server。
server {
    listen 80;
    server_name _;

    # Certbot 申请证书用的校验目录（启用 HTTPS 时需要）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 前端（首次引导阶段 next 可能尚未部署；
    # 用变量式 proxy_pass + Docker 内置 DNS resolver(127.0.0.11)，
    # 避免 nginx 启动时硬解析 next 失败而 emerg 崩溃导致死循环。
    # next 未起时访问 / 返回 502（预期），/admin 走下方 strapi 不受影响。）
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $next_upstream http://next:3000;
        proxy_pass $next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API / 上传媒体 / 管理后台
    location ~ ^/(api|uploads|admin|i18n|content-manager|content-type-builder) {
        proxy_pass http://strapi:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

