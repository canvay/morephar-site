# Morephar 站点 - Nginx 反代配置
# 前端 (Next.js) 走 /，后端 (Strapi) 走其管理端/API 前缀

# ============ HTTP (80) ============
# 未申请 HTTPS 证书前，先用这个 80 端口配置让站点跑起来。
# 申请到证书后，建议把下面 location / 与 API 段复制进 443 块并启用下方 HTTPS server。
server {
    listen 80;
    server_name _;

    # Docker 内置 DNS，使 upstream 在容器 IP 变化时可被重新解析
    # （避免写死 IP 后容器重启 / 重建导致 502）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Certbot 申请证书用的校验目录（启用 HTTPS 时需要）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 前端（首次引导阶段 next 可能尚未部署；
    # next 未起时访问 / 返回 502 是预期的，/admin 等 strapi 路径不受影响。）
    location / {
        set $next_upstream http://next:3000;
        proxy_pass $next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API / 上传媒体 / 管理后台 / 各插件管理端 API
    # 注意：upload 插件的管理端 API 是 /upload（不带 s），静态文件才是 /uploads，
    # 两者都要覆盖，否则媒体库(/upload/folders 等)请求会落到 next 上游导致 502。
    # users-permissions / seo-plugin 是后台「设置」里会用到的插件 API 前缀，
    # 不覆盖同样会 502。
    location ~ ^/(api|uploads|upload|admin|i18n|content-manager|content-type-builder|users-permissions|seo-plugin) {
        set $strapi_upstream http://strapi:1337;
        proxy_pass $strapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

