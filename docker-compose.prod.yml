# 生产编排（self-hosted runner 在 CVM 本机构建镜像并直接运行，无需镜像仓库）
# 用法:
#   docker compose -f docker-compose.prod.yml up -d
#
# 镜像为本地标签 morephar-strapi:latest / morephar-next:latest，
# 由 CI 在 runner 本机 build 产出，docker compose 直接使用本地镜像（不会去远程拉取）。
# nginx 仍从 Docker Hub 拉取（CVM 已配置国内镜像加速器）。

services:
  strapi:
    image: morephar-strapi:latest
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      NODE_ENV: production
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      STRAPI_URL: ${STRAPI_URL}
    volumes:
      - strapi_data:/app/.tmp
      - strapi_uploads:/app/public/uploads
      # Strapi import 会在 public/strapi-import-backups 建资源备份目录；单独挂可写卷，
      # 解除对 public 目录可写的硬依赖（与只读无关，纯防御性处理）。
      - strapi_import_backup:/app/public/strapi-import-backups
    expose:
      - "1337"

  next:
    image: morephar-next:latest
    restart: unless-stopped
    environment:
      # 服务端 fetch 直连 Strapi 容器（公网 NEXT_PUBLIC_STRAPI_API_URL 只对浏览器有效）
      STRAPI_API_URL: http://strapi:1337
    depends_on:
      - strapi
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    # 仅依赖 strapi：允许「先单独起后端+nginx」做首次引导(后台建 Token)，
    # 此时 next 镜像可能还不存在；后续前端部署再 up -d next 即可。
    depends_on:
      - strapi
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/www:/var/www/certbot:ro

volumes:
  strapi_data:
  strapi_uploads:
  strapi_import_backup:
